    function setTarget(value){target=Math.max(0,Math.min(1,value));if(!frame)frame=requestAnimationFrame(animate);if(target>.97&&!ambientTimer&&!reduced)ambientTimer=setInterval(()=>{if(current>.95&&!document.hidden&&petals.children.length<18)makePetal(1,true)},500);if(target<.94&&ambientTimer){clearInterval(ambientTimer);ambientTimer=0}}
    function stopAuto(){if(autoFrame){cancelAnimationFrame(autoFrame);autoFrame=0}}
    function play(){stopAuto();if(frame){cancelAnimationFrame(frame);frame=0}clearInterval(ambientTimer);ambientTimer=0;petals.replaceChildren();lastPetal=0;target=0;current=0;preview.dataset.open='false';render(0);if(reduced){render(1);preview.dataset.open='true';return}let start=0;function step(now){if(!start)start=now;const t=Math.min(1,(now-start)/1850);target=t;current=t;render(t);if(t>lastPetal+.055&&t<.94){makePetal(t);lastPetal=t}if(t>.97&&!ambientTimer)ambientTimer=setInterval(()=>{if(current>.95&&!document.hidden&&petals.children.length<18)makePetal(1,true)},500);if(t<1)autoFrame=requestAnimationFrame(step);else{autoFrame=0;preview.dataset.open='true'}}autoFrame=requestAnimationFrame(step)}
    function moveBy(delta){if(reduced)return;stopAuto();setTarget(target+delta)}
    window.addEventListener('wheel',e=>{if(e.target.closest('a,button'))return;e.preventDefault();moveBy(Math.sign(e.deltaY)*Math.min(Math.abs(e.deltaY),150)/1250)},{passive:false});
    preview.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});preview.addEventListener('touchmove',e=>{if(touchY===null)return;e.preventDefault();const next=e.touches[0].clientY;moveBy((touchY-next)/Math.max(innerHeight*.95,420));touchY=next},{passive:false});preview.addEventListener('touchend',()=>{touchY=null});
    window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();moveBy(.12)}else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();moveBy(-.12)}else if(e.key==='Home'){e.preventDefault();setTarget(0)}else if(e.key==='End'){e.preventDefault();setTarget(1)}});
    replay.textContent='重看展开';replay.addEventListener('click',play);render(embedded?0:reduced?1:0);
    if(embedded){window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data?.type==='series-scroll-play')play();if(event.data?.type==='series-scroll-reset'){stopAuto();if(frame){cancelAnimationFrame(frame);frame=0}clearInterval(ambientTimer);ambientTimer=0;petals.replaceChildren();target=0;current=0;preview.dataset.open='false';render(0)}})}
    else{window.addEventListener('load',()=>{if(document.hidden)return;setTimeout(play,350)},{once:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&current<.01&&!autoFrame)play()})}
  </script>
</body>
